# Runs the whole check pipeline on every pull request and on main. A pull request with one finding
# turns red, so it has to be fixed before it can be merged.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

# The job only reads the code; GitHub's token gets no right to change anything.
permissions:
  contents: read

# A newer push replaces the run of an older one instead of using a second Mac.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The app needs macOS 27 and Xcode 27; this image runs both on Apple silicon.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      # Pinned to a commit, which nobody can move; for a newer version, pin its commit here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the whole history, so the commit messages of a pull request can be read
          persist-credentials: false  # no later step needs the token, so it is not kept on disk
      # A fixed version, so a new SwiftLint never turns the checks red on unchanged code. The
      # download must match the checksum GitHub shows for the release, or the job stops here.
      - name: Install SwiftLint
        env:
          SWIFTLINT_RELEASES: https://github.com/realm/SwiftLint/releases/download
          SWIFTLINT_VERSION: 0.65.1
          SWIFTLINT_CHECKSUM: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          archive="$RUNNER_TEMP/swiftlint.zip"
          curl --fail --silent --show-error --location --output "$archive" \
            "$SWIFTLINT_RELEASES/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_CHECKSUM  $archive" | shasum --algorithm 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: The whole check pipeline (every step of scripts/check.py)
        run: make check
      - name: Build the app and its icon
        run: make build
