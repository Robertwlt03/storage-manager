# Runs the whole check pipeline on every pull request and on main, its groups side by side, each on
# a Mac of its own. A pull request with one finding turns red, so it has to be fixed before it can
# be merged.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

# The job only reads the code; GitHub's token gets no right to change anything.
permissions:
  contents: read

# A newer push replaces the run of an older one instead of using a second Mac.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The groups of scripts/check.py (GROUPS), one job each, so the run shows every part on its own.
  # The app needs macOS 27 and Xcode 27: GitHub's own Mac image for them, on Apple silicon. Each
  # job gets a fresh Mac that GitHub throws away afterwards, so a fork's pull request may run too.
  # Pinned to a commit, which nobody can move; for a newer version, pin its commit here. A new
  # group gets a job of its own here and a place in the needs of checks.
  build-and-tests:
    # Formatting, SwiftLint, the build, the tests and their coverage.
    name: Build and tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no later step needs the token, so it is not kept on disk
      - uses: ./.github/actions/setup
      - name: The steps of the group tools
        env:
          PYTHONPATH: scripts
        run: python scripts/check.py tools

  code-rules:
    # The house rules, the architecture, dead code and the language of names.
    name: Code rules
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no later step needs the token, so it is not kept on disk
      - uses: ./.github/actions/setup
      - name: The steps of the group code
        env:
          PYTHONPATH: scripts
        run: python scripts/check.py code

  texts-and-guides:
    # Translations, guides and unused files.
    name: Texts and guides
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no later step needs the token, so it is not kept on disk
      - uses: ./.github/actions/setup
      - name: The steps of the group texts
        env:
          PYTHONPATH: scripts
        run: python scripts/check.py texts

  safety-and-scripts:
    # Secrets, security, the scripts, commit messages and the planted samples.
    name: Safety and scripts
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the whole history, so the commit messages of a pull request can be read
          persist-credentials: false  # no later step needs the token, so it is not kept on disk
      - uses: ./.github/actions/setup
      - name: The steps of the group safety
        env:
          PYTHONPATH: scripts
        run: python scripts/check.py safety

  app:
    name: App and icon
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make build

  checks:
    # One result for the rule that protects main: green only when every job above is. It only
    # compares results, so a small Linux machine does and no Mac waits for it. It also runs when
    # a job failed, but not for a run a newer push replaced.
    needs: [build-and-tests, code-rules, texts-and-guides, safety-and-scripts, app]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          [[ " $RESULTS " != *" failure "* && " $RESULTS " != *" cancelled "* ]]
