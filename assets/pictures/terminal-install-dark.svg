<svg xmlns="http://www.w3.org/2000/svg" width="900" height="228" viewBox="0 0 900 228" role="img" aria-label="Installing from the terminal: attach the disk image, copy the app, detach it, allow the first launch and open the app">
<rect x="1" y="1" width="898" height="226" rx="12" fill="#1C1C1E" stroke="#3A3A3C"/>
<path d="M1 40V13a12 12 0 0 1 12-12h874a12 12 0 0 1 12 12v27z" fill="#2C2C2E"/>
<line x1="1" y1="40" x2="899" y2="40" stroke="#3A3A3C"/>
<circle cx="24" cy="20.5" r="6" fill="#FF5F57"/><circle cx="44" cy="20.5" r="6" fill="#FEBC2E"/><circle cx="64" cy="20.5" r="6" fill="#28C840"/>
<text x="450" y="25" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#A1A1A6" text-anchor="middle" xml:space="preserve">Terminal &#8212; zsh</text>
<text x="28" y="74" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#5BD27A" text-anchor="start" xml:space="preserve">$</text>
<text x="46" y="74" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#F5F5F7" text-anchor="start" textLength="415.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">hdiutil attach ~/Downloads/Storage-Manager.dmg</text>
<rect x="45" y="57" width="419.4" height="23" fill="#1C1C1E"><animate attributeName="x" from="45" to="464.4" begin="0.40s" dur="0.92s" fill="freeze"/><animate attributeName="width" from="419.4" to="0" begin="0.40s" dur="0.92s" fill="freeze"/></rect>
<text x="28" y="98" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#5BD27A" text-anchor="start" xml:space="preserve">$</text>
<text x="46" y="98" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#F5F5F7" text-anchor="start" textLength="605.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">cp -R &quot;/Volumes/Storage Manager/Storage Manager.app&quot; /Applications/</text>
<rect x="45" y="81" width="609.0" height="23" fill="#1C1C1E"><animate attributeName="x" from="45" to="654.0" begin="1.67s" dur="1.34s" fill="freeze"/><animate attributeName="width" from="609.0" to="0" begin="1.67s" dur="1.34s" fill="freeze"/></rect>
<text x="28" y="122" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#5BD27A" text-anchor="start" xml:space="preserve">$</text>
<text x="46" y="122" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#F5F5F7" text-anchor="start" textLength="370.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">hdiutil detach &quot;/Volumes/Storage Manager&quot;</text>
<rect x="45" y="105" width="374.2" height="23" fill="#1C1C1E"><animate attributeName="x" from="45" to="419.2" begin="3.36s" dur="0.82s" fill="freeze"/><animate attributeName="width" from="374.2" to="0" begin="3.36s" dur="0.82s" fill="freeze"/></rect>
<text x="28" y="146" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#5BD27A" text-anchor="start" xml:space="preserve">$</text>
<text x="46" y="146" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#F5F5F7" text-anchor="start" textLength="596.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">xattr -dr com.apple.quarantine &quot;/Applications/Storage Manager.app&quot;</text>
<rect x="45" y="129" width="600.0" height="23" fill="#1C1C1E"><animate attributeName="x" from="45" to="645.0" begin="4.53s" dur="1.32s" fill="freeze"/><animate attributeName="width" from="600.0" to="0" begin="4.53s" dur="1.32s" fill="freeze"/></rect>
<text x="28" y="170" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#5BD27A" text-anchor="start" xml:space="preserve">$</text>
<text x="46" y="170" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#F5F5F7" text-anchor="start" textLength="361.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">open &quot;/Applications/Storage Manager.app&quot;</text>
<rect x="45" y="153" width="365.2" height="23" fill="#1C1C1E"><animate attributeName="x" from="45" to="410.2" begin="6.20s" dur="0.80s" fill="freeze"/><animate attributeName="width" from="365.2" to="0" begin="6.20s" dur="0.80s" fill="freeze"/></rect>
<g opacity="0"><text x="46" y="194" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#8E8E93" text-anchor="start" xml:space="preserve"># Storage Manager opens and asks for Full Disk Access</text><set attributeName="opacity" to="1" begin="7.35s" fill="freeze"/></g>
</svg>
